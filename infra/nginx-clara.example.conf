# Add this as a separate Nginx site after choosing the staging subdomain.
# Replace staging.example.com and confirm that the local port matches
# CLARA_WEB_BIND_PORT in .env.staging before enabling the site.
server {
    listen 80;
    listen [::]:80;
    server_name staging.example.com;

    location / {
        proxy_pass http://127.0.0.1:14310;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
